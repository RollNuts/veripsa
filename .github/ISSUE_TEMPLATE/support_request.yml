name: Source support
description: Ask about the public source or offline evaluator
title: "Support: "
labels: [support]
body:
  - type: markdown
    attributes:
      value: |
        The project-hosted service is intentionally suspended. Installation, hosted checks, comments, and endpoint availability are not currently supported.

        Do not include private repository names or URLs, PR/check/comment URLs, branch names, commit hashes, provider or delivery identifiers, payloads, source or diff bodies, credentials, tokens, local user paths, or customer data. Use synthetic examples. Report vulnerabilities through SECURITY.md.
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Offline evaluator
        - Local development
        - Public source documentation
        - Signal semantics
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Ask using synthetic or already-public project data only.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data check
      options:
        - label: This request contains only synthetic or already-public project data and no security-sensitive values.
          required: true

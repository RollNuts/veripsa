name: public-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-release-gates:
    name: public-release-gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce public boundary
        run: python3 scripts/public_snapshot_gate.py

      - name: Install focused runtime dependencies
        run: >-
          python3 -m pip install --no-deps
          'psycopg2-binary>=2.9,<2.10'
          'tree-sitter==0.23.2'
          'tree-sitter-rust==0.21.2'
          'tree-sitter-typescript==0.23.2'

      - name: Scan credential and local-path hygiene
        run: python3 tests/test_secret_hygiene.py

      - name: Compile Python sources
        run: python3 -m compileall -q .

      - name: Check Tauri imports and inactive-service references
        run: |
          python3 -c 'import code_graph_extract as X; assert {"rust", "typescript", "tsx"} <= set(X._ts_languages())'
          python3 tests/test_tauri_command_contract.py
          python3 tests/test_external_probe_target.py
          python3 tests/test_coverage_percent.py

      - name: Reproduce local structural-overlap evidence
        run: python3 -m unittest discover -s tests -p 'test_structural_overlap_demo.py' -v

      - name: Check local file-review and strict history boundaries
        run: |
          python3 -B -m unittest discover -s tests -p 'test_review_file.py' -v
          python3 -B tests/test_cochange.py

      - name: Check synthetic review-pair scoring and measurement boundaries
        run: python3 -m unittest discover -s tests -p 'test_structural_overlap_benchmark.py' -v

      - name: Run credential lifecycle leak test
        run: python3 tests/test_auth_lifecycle.py

      - name: Run content-free renderer test
        run: python3 tests/test_split_advice.py

      - name: Verify inactive public App manifest contract
        run: python3 tests/test_app_manifest_public_contract.py

      - name: Verify public status and HTTP privacy boundaries
        run: |
          python3 tests/test_public_statusz.py
          python3 tests/test_http_security_headers.py
